<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Skin & Item Free Fire</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #111827; color: #f3f4f6; padding: 15px; }
    .container { max-width: 900px; margin: 0 auto; text-align: center; }
    h1 { color: #f59e0b; margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
    .search-box { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
    input { width: 70%; padding: 12px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 15px; }
    input:focus { outline: none; border-color: #f59e0b; }
    button { padding: 12px 20px; background: #d97706; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #b45309; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 15px; }
    .card { background: #1f2937; padding: 10px; border-radius: 8px; border: 1px solid #374151; display: flex; flex-direction: column; align-items: center; }
    .card img { width: 100%; height: 130px; object-fit: contain; border-radius: 6px; background: #111827; }
    .card .title { font-weight: bold; font-size: 13px; margin-top: 8px; color: #f9fafb; word-break: break-word; }
    .card .id { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    .loading { margin-top: 30px; color: #9ca3af; font-size: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cek Skin & Item Free Fire</h1>
    <div class="search-box">
      <input type="text" id="search" placeholder="Cari ID atau Nama Skin FF...">
      <button onclick="doSearch()">Cari</button>
    </div>
    <div id="loading" class="loading">Memuat database skin FF...</div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    let items = [];

    async function loadData() {
      const loading = document.getElementById('loading');
      try {
        // Mengambil data item dari folder assets
        const res = await fetch('./assets/itemData.json');
        if (!res.ok) throw new Error('File itemData.json tidak ditemukan');
        
        items = await res.json();
        loading.style.display = 'none';
        render(items);
      } catch (e) {
        console.error(e);
        loading.innerText = 'Gagal memuat assets/itemData.json. Pastikan file JSON ada di folder assets.';
        loading.style.color = '#ef4444';
      }
    }

    function render(list) {
      const g = document.getElementById('grid');
      g.innerHTML = '';

      if (list.length === 0) {
        g.innerHTML = '<p style="grid-column: 1/-1; color: #9ca3af;">Skin/Item FF tidak ditemukan.</p>';
        return;
      }

      list.forEach(i => {
        const name = i.name || i.itemName || i.skinName || 'Skin FF';
        const id = i.id || i.itemId || i.skinId || '-';
        // Membaca gambar dari icon, image, atau fallback ke folder icon bawaan
        const img = i.icon || i.image || `./icon/${id}.png`;

        g.innerHTML += `
          <div class="card">
            <img src="${img}" alt="${name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/150/1f2937/f59e0b?text=No+Image';">
            <div class="title">${name}</div>
            <div class="id">ID: ${id}</div>
          </div>`;
      });
    }

    function doSearch() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const filtered = items.filter(i => {
        const name = (i.name || i.itemName || i.skinName || '').toString().toLowerCase();
        const id = (i.id || i.itemId || i.skinId || '').toString().toLowerCase();
        return name.includes(q) || id.includes(q);
      });
      render(filtered);
    }

    document.getElementById('search').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
